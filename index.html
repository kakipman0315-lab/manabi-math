
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>因数分解ゲーム</title>
<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f0f5ff;
  padding: 16px;
}
.card {
  background: white;
  padding: 18px;
  border-radius: 18px;
  max-width: 420px;
  margin: auto;
}
#question {
  font-size: 27px;
  font-weight: bold;
  margin: 24px 0;
}
#answer {
  font-size: 23px;
  min-height: 35px;
  padding: 10px;
  border: 2px solid #aac5ff;
  border-radius: 10px;
  overflow-wrap: anywhere;
}
.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 14px;
}
button {
  font-size: 20px;
  padding: 13px 4px;
  border: none;
  border-radius: 10px;
  background: #dce8ff;
}
button:active { background: #a9c5ff; }
.action {
  background: #2864dc;
  color: white;
  margin-top: 12px;
  width: 100%;
}
#message { min-height: 28px; }
</style>
</head>
<body>
<div class="card">
  <h1>🧮 因数分解ゲーム</h1>
  <p>次の式を因数分解しよう！</p>
  <div id="question"></div>
  <div id="answer"></div>
  <div class="keys" id="keys"></div>
  <button class="action" onclick="checkAnswer()">答え合わせ</button>
  <p id="message"></p>
  <p>正解：<span id="score">0</span>問</p>
  <button onclick="newQuestion()">次の問題</button>
</div>

<script>
let a, b, score = 0;
let answer = "";

const symbols = [
  "(", ")", "x", "²",
  "+", "−", "×", "÷",
  "1", "2", "3", "⌫",
  "4", "5", "6", "C",
  "7", "8", "9", "%",
  "0"
];

const keys = document.getElementById("keys");

symbols.forEach(s => {
  const button = document.createElement("button");
  button.textContent = s;
  button.onclick = () => {
    if (s === "⌫") {
      answer = answer.slice(0, -1);
    } else if (s === "C") {
      answer = "";
    } else {
      answer += s;
    }
    document.getElementById("answer").textContent =
      answer || "ここに答えが入るよ";
  };
  keys.appendChild(button);
});

function newQuestion() {
  a = Math.floor(Math.random() * 11) - 5;
  b = Math.floor(Math.random() * 11) - 5;

  if (a === 0) a = 2;
  if (b === 0) b = 3;

  const sum = a + b;
  const product = a * b;
  const sign = n => n < 0 ? "−" + Math.abs(n) : "+" + n;

  document.getElementById("question").textContent =
    "x² " + sign(sum) + "x " + sign(product);

  answer = "";
  document.getElementById("answer").textContent = "";
  document.getElementById("message").textContent = "";
}

function checkAnswer() {
  const clean = answer.replace(/\s/g, "")
    .replace(/−/g, "-")
    .replace(/＋/g, "+")
    .replace(/×/g, "*");

  const match = clean.match(
    /^\(x([+-]\d+)\)\(x([+-]\d+)\)$/
  );

  if (!match) {
    document.getElementById("message").textContent =
      "（x+2）（x+3）の形で入力してね！";
    return;
  }

  const n1 = Number(match[1]);
  const n2 = Number(match[2]);

  if ((n1 === a && n2 === b) ||
      (n1 === b && n2 === a)) {
    score++;
    document.getElementById("score").textContent = score;
    document.getElementById("message").textContent =
      "🎉 正解！すごい！";
  } else {
    document.getElementById("message").textContent =
      "おしい！符号と数字を確認してみよう！";
  }
}

newQuestion();
</script>
</body>
</html>
